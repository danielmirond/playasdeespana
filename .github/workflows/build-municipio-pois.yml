name: Sidecar POIs de municipios

# Regenera public/data/municipio-pois.json llamando a Overpass y hace
# commit si el resultado cambia. El cron corre el 1º de cada mes a las
# 04:00 UTC (poca carga en Overpass); también se puede lanzar a mano
# desde la pestaña Actions de GitHub cuando se amplíe la lista de
# municipios del script.
#
# POR QUÉ AQUÍ Y NO EN LOCAL. Overpass está bloqueado en el sandbox de
# Claude Code y también en el entorno de Vercel; corriéndolo en el
# runner de GitHub Actions es la única forma de mantener el sidecar
# fresco de manera automatizada. El commit lleva [skip ci] para no
# disparar otros workflows en cascada.

on:
  workflow_dispatch:            # botón manual desde Actions
  schedule:
    - cron: '0 4 1 * *'         # 1º de mes, 04:00 UTC (~05:00-06:00 España)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Overpass build
        # El script tiene reanudación integrada: si ya hay un JSON con
        # entradas cacheadas del mismo mes, no vuelve a llamar a Overpass
        # por ellas. En el cron mensual el cache está vacío y regenera
        # todo desde cero.
        run: node scripts/build-municipio-pois.mjs --refrescar

      - name: Fotos del carrusel (Wikipedia/Commons, licencia libre)
        run: node scripts/resolve-pois-fotos.mjs

      - name: Commit and push sidecar
        # `pull --rebase` antes del push: el script tarda 10-20 min y
        # cualquier commit intermedio a main hacía rechazar el push
        # (rejected: fetch first). Como el bot solo toca UN fichero, la
        # rebase se aplica limpia siempre; si por lo que sea un humano
        # ha editado ese mismo JSON en paralelo (poco probable), es
        # mejor fallar la rebase que sobrescribir.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/municipio-pois.json
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "data(pois): sidecar mensual de municipios [skip ci]

            Regenerado desde Overpass API para los municipios listados en
            scripts/build-municipio-pois.mjs. Los tags consultados son
            los estándar de OSM (tourism, historic, amenity, man_made,
            leisure) dentro de un radio de 3 km del centroide.
            Automated by .github/workflows/build-municipio-pois.yml"
            # Puede haber commits humanos mientras el runner trabajaba.
            git pull --rebase origin main
            git push
          fi
